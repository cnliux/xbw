// libretro FCEUmm 核心（NES/FC）—— 独立原生库模块。
// 产物 libfceumm.so 打进 APK；C++ 层用 dlopen 加载它并调用 retro_* 导出。
// 与 app 模块解耦：核心源码在 vendor/ 下，不参与 Kotlin 编译。
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.xbw.tv.core.fceumm'
    compileSdk 34

    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'   // 纯 C 核心，不链 libc++
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    // 核心是 GPL：源码位置随包声明（合规习惯，方便审计）
    packagingOptions {
        jniLibs { useLegacyPackaging = false }
    }
}
