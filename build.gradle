// 顶层构建脚本：固定插件版本，保证任何机器上 clone 下来都能编译
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

ext {
    // 目标设备统一为 64 位 ARM TV 盒子：只构建 arm64-v8a，避免打包 32 位 .so 让 APK 体积翻倍。
    // FBNeo 的 32 位 off_t workaround 已随 32 位支持一起移除，不再提供兼容包覆盖。
    appAbis = ['arm64-v8a'] as String[]
}
