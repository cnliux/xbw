#cheatlist {
	list-style-type: none;
	/* max-width: 500px; */
	margin: 0 auto;
	padding: 0 15px;
}

#cheatlist>li {
	background: white;
	margin-top: 10px;
	border-radius: 8px;
	overflow: hidden;
	padding: 15px;
	position: relative;
}
input[type="checkbox"] {
	position: absolute;
	opacity: 0;
}
input[type="checkbox"].ios-switch + div {
	vertical-align: middle;
	width: 40px;	height: 20px;
	border: 1px solid rgba(0,0,0,.4);
	border-radius: 999px;
	background-color: rgba(0, 0, 0, 0.1);
	-webkit-transition-duration: .4s;
	-webkit-transition-property: background-color, box-shadow;
	box-shadow: inset 0 0 0 0px rgba(0,0,0,0.4);
	right: 20px;
    position: absolute;
}
input[type="checkbox"].bigswitch.ios-switch + div {
	width: 50px;	height: 25px;
}
input[type="checkbox"].green.ios-switch:checked + div {
	background-color: #00e359;
	border: 1px solid rgba(0, 162, 63,1);
	box-shadow: inset 0 0 0 10px rgba(0,227,89,1);
}
input[type="checkbox"].ios-switch + div > div {
	float: left;
	width: 18px; height: 18px;
	border-radius: inherit;
	background: #ffffff;
	-webkit-transition-timing-function: cubic-bezier(.54,1.85,.5,1);
	-webkit-transition-duration: 0.4s;
	-webkit-transition-property: transform, background-color, box-shadow;
	-moz-transition-timing-function: cubic-bezier(.54,1.85,.5,1);
	-moz-transition-duration: 0.4s;
	-moz-transition-property: transform, background-color;
	box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3), 0px 0px 0 1px rgba(0, 0, 0, 0.4);
	pointer-events: none;
	margin-top: 1px;
	margin-left: 1px;
}
input[type="checkbox"].bigswitch.ios-switch + div > div {
	width: 23px; height: 23px;
	margin-top: 1px;
}
input[type="checkbox"].bigswitch.ios-switch:checked + div > div {
	-webkit-transform: translate3d(25px, 0, 0);
	-moz-transform: translate3d(16px, 0, 0);
	box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3), 0px 0px 0 1px rgba(8, 80, 172,1);
}
input[type="checkbox"].green.ios-switch:checked + div > div {
	box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 162, 63,1);
}
.name {
    margin-right: 50px;
    margin-left: 20px;
    position: absolute;
    font-size: 1.1em;
    font-weight: 600;
	color:#000;
}
.cheatline{
	position: relative;
	top: 20px;
	margin-top: 20px;
	width: 100%;
	background: #edebeb;
    border-radius: 8px;
    overflow: hidden;
    padding: 15px;
}
.cheat-radio {
	-webkit-appearance: none; /* remove default */
	display: block;
	margin-left: calc(100% - 25px);
	width: 30px;
	height: 30px;
	border-radius: 12px;
	cursor: pointer;
	vertical-align: middle;
	box-shadow: hsla(0,0%,100%,.15) 0 1px 1px, inset hsla(0,0%,0%,.5) 0 0 0 1px;
	background-color: hsla(0,0%,0%,.2);
	background-image: -webkit-radial-gradient( hsla(200,100%,90%,1) 0%, hsla(200,100%,70%,1) 15%, hsla(200,100%,60%,.3) 28%, hsla(200,100%,30%,0) 70% );
	background-repeat: no-repeat;
	-webkit-transition: background-position .1s cubic-bezier(.8, 0, 1, 1),
	-webkit-transform .1s cubic-bezier(.8, 0, 1, 1);
}
.cheatradio-div input:checked {
	-webkit-transition: background-position .1s .1s cubic-bezier(0, 0, .2, 1),
	-webkit-transform .25s cubic-bezier(0, 0, .2, 1);
}
.cheatradio-div input:active {
	/*-webkit-transform: scale(1.5);*/
	-webkit-transition: -webkit-transform .1s cubic-bezier(0, 0, .2, 1);
}

.cheatradio-div input,
.cheatradio-div input:active {
	background-position: 0 24px;
}
.cheatradio-div input:checked {
	background-position: 0 0;
}
.cheatradio-div input:checked ~ input,
.cheatradio-div input:checked ~ input:active {
	background-position: 0 -24px;
}

.before-load{
	pointer-events: none;
}
.load-tips{

    gap: 5px;
}
#zoomdiv{
	position:absolute;
	z-index:100
}
