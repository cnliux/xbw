plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.xbw.tv'
    compileSdk 34

    // 正式签名参数放 local.properties（已 gitignore，密钥不入库）：
    //   xbw.storeFile=keystore/xbw-release.jks
    //   xbw.storePassword=...
    //   xbw.keyAlias=xbw
    //   xbw.keyPassword=...
    def xbwProps = new Properties()
    def xbwPropsFile = rootProject.file('local.properties')
    if (xbwPropsFile.exists()) xbwPropsFile.withInputStream { xbwProps.load(it) }
    def hasXbwSigning = xbwProps['xbw.storeFile'] && xbwProps['xbw.storePassword'] \
        && xbwProps['xbw.keyAlias'] && xbwProps['xbw.keyPassword']

    signingConfigs {
        if (hasXbwSigning) {
            release {
                storeFile rootProject.file(xbwProps['xbw.storeFile'])
                storePassword xbwProps['xbw.storePassword']
                keyAlias xbwProps['xbw.keyAlias']
                keyPassword xbwProps['xbw.keyPassword']
            }
        }
    }

    // 版本号单一来源：CI（.github/workflows/build.yml）用 Release tag 的数字
    // `v<run_number>` 通过 -PbuildNo=N 注入；本地不传就是 1。
    // App 内 UpdateChecker 也按这个数字比大小（tag v12 > 本地 versionCode 11 才提示升级）。
    def buildNoRaw = (project.findProperty('buildNo') ?: System.getenv('BUILD_NO') ?: '1').toString()
    def buildNo = (buildNoRaw.isInteger() ? buildNoRaw.toInteger() : 1) as int

    defaultConfig {
        applicationId "com.xbw.tv"
        minSdk 21
        targetSdk 34
        versionCode buildNo
        versionName "v${buildNo}"

        // 只打包中文资源，减小 APK 体积
        resourceConfigurations += ['zh', 'zh-rCN']

        // 原生宿主 libxbwcore.so：dlopen 各 libretro 核心（libfceumm.so …）
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'   // 纯 C，无 libc++ 依赖
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有正式签名（local.properties 配齐）就用正式的，否则回退 debug 保证可构建
            signingConfig hasXbwSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // ★ 关键：API 21~25 的老盒子（Android 5.0~7.1）没有 java.util.function /
        //   ThreadLocal.withInitial / java.time 等 Java 8+ API。OkHttp 4 / 协程 / Jsoup
        //   在运行时会抛 NoSuchMethodError（实测报 ThreadLocal.withInitial），
        //   导致大厅与游戏页全部"网络请求失败"。开启脱糖后这些 API 被回填，全部兼容。
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
    }
}

dependencies {
    // ---- libretro 核心模块（各自产出 lib<core>.so 打进 APK，运行时 dlopen）----
    implementation project(':fceumm')
    implementation project(':fbneo')
    implementation project(':snes9x')
    implementation project(':mgba')
    implementation project(':genesis_plus_gx')



    // ---- AndroidX 基础 ----
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---- 生命周期 / MVVM ----
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // ---- Room（列表缓存，仅用于秒开，启动后仍会后台刷新）----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ---- 网络 / 解析 / 图片 ----
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    // SFC 的 ROM 站点以 7z 分发（file.1990i.com/sfc/*.7z）。commons-compress
    // 自带 LZMA2 解码器；xz 兜底纯 LZMA 封装的老包。
    implementation 'org.apache.commons:commons-compress:1.21'
    implementation 'org.tukaani:xz:1.12'

    // ---- 协程 ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ---- Java 8+ API 脱糖运行时（支持 Android 5.0+，见 compileOptions 注释）----
    // nio 版：commons-compress 的 7z 解码用到 java.nio.file，需要 desugar_jdk_libs_nio 回填
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
