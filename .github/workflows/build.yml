name: Build APK

on:
  push:
    branches: [master]     # 推 master 自动出包（Release tag = v<自动递增的 patch 版本>）
  workflow_dispatch:       # 也可手动触发（Actions 页 → Build APK → Run workflow）

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 并挂 APK 附件
    steps:
      - uses: actions/checkout@v4

      # vendor/ 是独立 git 仓库、被 .gitignore 排除，checkout 后没有核心源码。
      # 这里按本地锁定的 commit 从上游精确还原（两个仓库本地均无改动）。
      - name: Restore vendor cores (pinned)
        run: |
          mkdir -p vendor
          git init -q vendor/fbneo && git -C vendor/fbneo remote add origin https://github.com/libretro/fbneo.git
          git -C vendor/fbneo fetch -q --depth=1 origin a4012b161e48b33b94940f07987323574c237448
          git -C vendor/fbneo checkout -q FETCH_HEAD
          git init -q vendor/libretro-fceumm && git -C vendor/libretro-fceumm remote add origin https://github.com/libretro/libretro-fceumm.git
          git -C vendor/libretro-fceumm fetch -q --depth=1 origin 7a542dab1e87679921962a9f056186eca425c0c2
          git -C vendor/libretro-fceumm checkout -q FETCH_HEAD
          git init -q vendor/libretro-common && git -C vendor/libretro-common remote add origin https://github.com/libretro/libretro-common.git
          git -C vendor/libretro-common fetch -q --depth=1 origin 9b73a999df01db5657db95b2490cf031e4b51cff
          git -C vendor/libretro-common checkout -q FETCH_HEAD
          git init -q vendor/snes9x && git -C vendor/snes9x remote add origin https://github.com/libretro/snes9x.git
          git -C vendor/snes9x fetch -q --depth=1 origin fae2fea08f74180759ef540ee94259213f503480
          git -C vendor/snes9x checkout -q FETCH_HEAD
          git init -q vendor/mgba && git -C vendor/mgba remote add origin https://github.com/libretro/mgba.git
          git -C vendor/mgba fetch -q --depth=1 origin 7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6
          git -C vendor/mgba checkout -q FETCH_HEAD
          git init -q vendor/Genesis-Plus-GX && git -C vendor/Genesis-Plus-GX remote add origin https://github.com/libretro/Genesis-Plus-GX.git
          git -C vendor/Genesis-Plus-GX fetch -q --depth=1 origin c2838c7dc4236fc2fe94e5dbd08b41486067918e
          git -C vendor/Genesis-Plus-GX checkout -q FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # android-actions/setup-android@v3 在 cmdline-tools 16.0 上装废弃 tools 包必炸，弃用
      - name: Install NDK / CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Restore release signing from secrets
        env:
          KEYSTORE_B64: ${{ secrets.XBW_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.XBW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XBW_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.XBW_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/xbw-release.jks
            cat >> local.properties <<EOF
          xbw.storeFile=keystore/xbw-release.jks
          xbw.storePassword=$STORE_PASS
          xbw.keyAlias=$KEY_ALIAS
          xbw.keyPassword=$KEY_PASS
          EOF
            echo "release signing restored from secrets"
          else
            echo "no signing secrets, release falls back to debug signature"
          fi

# 版本号：语义化 major.minor.patch，首个正式版 v0.0.1，之后每次 patch+1。
      # 从"上一个 Release tag"推导而不是提交回仓库，所以不需要 CI 有写权限，
      # 也不会出现"bump 提交又触发新一轮构建"的死循环。
      - name: Resolve version
        id: ver
        run: |
          LATEST=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
                    "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
                    | grep -m1 '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [[ "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            echo "previous release: $LATEST -> next: v$VERSION"
          else
            VERSION="0.0.1"     # 首个正式版；旧式 tag（v13 / build-12）一律视为历史
            echo "no semver release yet (latest='$LATEST') -> start at v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug + release APK
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PappVersion="${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      # Release 附件是原始文件（不 zip），Releases 页直接下载 .apk
      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 小霸王 TV v${{ steps.ver.outputs.version }}
          body: |
            自动构建 `${{ github.sha }}`（${{ github.ref_name }}）

            - app-debug.apk — 调试版
            - app-release.apk — 正式签名版（版本号 v${{ steps.ver.outputs.version }}）

            App 内「设置 → 立即检查更新」会自动发现本版本；
            下载源在多个 CDN 之间实测选最快的那个。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
